# Checks that GitHub-hosted Windows and macOS runners start for this public repository.
name: Runner check

on:
  workflow_dispatch:

permissions: {}

jobs:
  check:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - run: echo "Runner started on ${{ matrix.os }}"
