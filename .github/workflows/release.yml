name: Desktop release

# Builds the Kızılelma desktop app from the private kubilaysabah/kizilelma repository and publishes
# it here, where anyone can download it (kizilelma ADR 0055). The builds run in this public
# repository because GitHub's Windows and macOS runners are free for public repositories; the
# source is checked out for the build only and never published.
#
# - Windows: an installer, Kizilelma-Windows-x64-Setup.exe (Inno Setup, per user), installed and
#   uninstalled once on the runner as a check.
# - Linux: one AppImage, Kizilelma-Linux-x86_64.AppImage, started once on a virtual screen as a
#   check.
# - macOS: the .app as a zip, kept as an artifact only until it is signed and notarised.
#
# Started by kizilelma's Delivery release (`gh workflow run release.yml`) or by hand (Actions →
# Desktop release → Run workflow; untick "publish" for a test build that is kept as artifacts).
# File names never change, so kizilelma.app/indir/* can link to the latest release. The builds are
# not signed: Windows SmartScreen warns about an unknown publisher.
#
# The version is built in (APP_VERSION): a released app finds a newer release here and installs it
# from inside (kizilelma ADR 0056). apps/client/packaging/notes/<version>.md, when it exists, is put
# at the top of the release's notes, which the app shows.
#
# Secret: SOURCE_TOKEN, a fine-grained token with Contents: read on kubilaysabah/kizilelma only.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version, without the v (e.g. 0.3.0)
        required: true
      ref:
        description: Commit, tag or branch of kubilaysabah/kizilelma to build
        default: main
        required: true
      platforms:
        description: Platforms to build, as a JSON list
        default: '["windows","linux"]'
        required: true
      publish:
        description: Publish a release (otherwise the files stay as this run's artifacts)
        type: boolean
        default: true
      api_url:
        description: API the app talks to (AppConfig.apiUrl)
        default: https://app.kizilelma.app/api
        required: true
      web_url:
        description: Web app the invite links open (AppConfig.webUrl)
        default: https://app.kizilelma.app
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

# Actions are pinned to a commit SHA, as in kizilelma's Quality.
jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.platform == 'windows' && 'windows-latest' || matrix.platform == 'macos' && 'macos-latest' || 'ubuntu-24.04' }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(inputs.platforms) }}
    defaults:
      run:
        working-directory: apps/client
        shell: bash
    env:
      API_URL: ${{ inputs.api_url }}
      WEB_URL: ${{ inputs.web_url }}
      VERSION: ${{ inputs.version }}
    steps:
      - name: Check the version
        working-directory: .
        run: |
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::Version must look like 1.2.3 or 1.2.3-beta.1, without a v"
            exit 1
          fi
      # The token is used for this checkout only and not kept in the working copy.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kubilaysabah/kizilelma
          ref: ${{ inputs.ref }}
          token: ${{ secrets.SOURCE_TOKEN }}
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: apps/client/pubspec.yaml
          cache: true
      - name: Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build libgtk-3-dev libx11-dev libxi-dev libsecret-1-dev \
            libnotify-dev libmpv-dev xvfb dbus-x11 gnome-keyring file
      - run: flutter pub get
      - name: Build
        run: |
          flutter build "${{ matrix.platform }}" --release --build-name="$VERSION" \
            --dart-define=API_URL="$API_URL" --dart-define=WEB_URL="$WEB_URL" \
            --dart-define=APP_VERSION="$VERSION"

      # Inno Setup reads relative paths from the .iss file's folder, so both are absolute.
      - name: Windows installer
        if: matrix.platform == 'windows'
        run: |
          mkdir -p ../../dist
          iscc="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
          [ -f "$iscc" ] || choco install innosetup -y --no-progress > /dev/null
          "$iscc" -Q "-DAppVersion=$VERSION" \
            "-DSourceDir=$(cygpath -w "$PWD/build/windows/x64/runner/Release")" \
            "-DOutputDir=$(cygpath -w "$GITHUB_WORKSPACE/dist")" packaging/windows/kizilelma.iss
      # Installs silently into a temporary folder and checks the app is there and was not started;
      # installs again as the app's update does (/RELAUNCH=1) and checks that it starts the app;
      # then uninstalls.
      - name: Check the installer
        if: matrix.platform == 'windows'
        run: |
          running() { tasklist //FI "IMAGENAME eq kizilelma_client.exe" | grep -q kizilelma_client; }
          target=$(cygpath -w "$RUNNER_TEMP/kizilelma-install")
          ../../dist/Kizilelma-Windows-x64-Setup.exe //VERYSILENT //SUPPRESSMSGBOXES //NORESTART "//DIR=$target"
          test -f "$RUNNER_TEMP/kizilelma-install/kizilelma_client.exe"
          test -f "$RUNNER_TEMP/kizilelma-install/data/app.so"
          sleep 3
          if running; then echo "::error::A silent install without /RELAUNCH=1 started the app"; exit 1; fi
          ../../dist/Kizilelma-Windows-x64-Setup.exe //SILENT //SUPPRESSMSGBOXES //NORESTART //CLOSEAPPLICATIONS //RELAUNCH=1 "//DIR=$target"
          for _ in $(seq 1 30); do running && break; sleep 1; done
          running || { echo "::error::/RELAUNCH=1 did not start the app"; exit 1; }
          taskkill //F //IM kizilelma_client.exe
          sleep 2
          "$RUNNER_TEMP/kizilelma-install/unins000.exe" //VERYSILENT //SUPPRESSMSGBOXES //NORESTART
          for _ in $(seq 1 30); do [ -f "$RUNNER_TEMP/kizilelma-install/kizilelma_client.exe" ] || break; sleep 1; done
          test ! -f "$RUNNER_TEMP/kizilelma-install/kizilelma_client.exe"

      - name: Linux AppImage
        if: matrix.platform == 'linux'
        working-directory: .
        run: apps/client/packaging/linux/build-appimage.sh "$VERSION" dist
      # Starts the AppImage on a virtual screen, with the keyring a desktop session has (the app
      # keeps its session in the Secret Service): still running after 20 s means every library was
      # found and the first frame was drawn without a crash.
      - name: Check the AppImage
        if: matrix.platform == 'linux'
        working-directory: .
        run: |
          set +e
          dbus-run-session -- sh -c 'printf "\n" | gnome-keyring-daemon --unlock --components=secrets > /dev/null
            exec xvfb-run -a timeout 20 dist/Kizilelma-Linux-x86_64.AppImage --appimage-extract-and-run'
          code=$?
          echo "exit code: $code"
          [ "$code" -eq 124 ]

      - name: macOS archive
        if: matrix.platform == 'macos'
        run: |
          mkdir -p ../../dist
          ditto -c -k --keepParent build/macos/Build/Products/Release/*.app ../../dist/kizilelma-macos.zip

      # The release notes of the commit built; each platform's artifact carries the same copy.
      - name: Release notes
        working-directory: .
        run: |
          mkdir -p dist
          notes="apps/client/packaging/notes/$VERSION.md"
          if [ -f "$notes" ]; then cp "$notes" dist/notes.md; else echo "No $notes"; fi
      - run: ls -la "$GITHUB_WORKSPACE/dist"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kizilelma-${{ matrix.platform }}
          path: dist/*
          retention-days: 30
          if-no-files-found: error

  # Always a full release, never a pre-release: GitHub's "latest" link skips pre-releases. Only the
  # Windows installer and the Linux AppImage are published; macOS waits for signing.
  publish:
    name: Publish the release
    needs: build
    if: ${{ inputs.publish }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: kizilelma-*
          path: dist
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set --
          for file in dist/Kizilelma-Windows-x64-Setup.exe dist/Kizilelma-Linux-x86_64.AppImage; do
            [ ! -f "$file" ] || set -- "$@" "$file"
          done
          [ "$#" -gt 0 ] || { echo "::error::No Windows or Linux file to publish"; exit 1; }
          {
            if [ -f dist/notes.md ]; then cat dist/notes.md; echo; else printf '%s\n\n' "Kızılelma $VERSION."; fi
            echo "İndir: https://kizilelma.app/indir · Tarayıcıda: https://app.kizilelma.app"
          } > notes.md
          gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --title "Kızılelma $VERSION" \
            --notes-file notes.md --latest "$@"
